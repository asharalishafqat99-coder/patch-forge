spring.application.name=PatchForge

server.servlet.context-path=/patchforge

# WAR files can be sizeable - raise the multipart limits well above typical WAR size
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB


patchforge.package-root-prefix=com
patchforge.sql-file-name=queries.sql
patchforge.guide-file-name=Guide.txt

app.developer=@project.developers[0].name@
app.version=@project.version@
app.logo-path=/images/patchforge-logo.svg