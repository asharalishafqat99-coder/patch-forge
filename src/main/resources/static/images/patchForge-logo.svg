<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="500" height="120" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- ICON GROUP -->
  <g transform="translate(15, 0)">
    <!-- Outer Shield / Patch Base -->
    <path d="M 65 22 L 102 36 V 64 C 102 83, 65 98, 65 98 C 65 98, 28 83, 28 64 V 36 Z" fill="url(#shieldBg)" stroke="url(#borderGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Inner Embroidered Stitch Line -->
    <path d="M 65 27 L 97 39 V 62 C 97 78, 65 92, 65 92 C 65 92, 33 78, 33 62 V 39 Z" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Code Brackets '< / >' -->
    <path d="M 52 48 L 43 57 L 52 66" fill="none" stroke="#2ea043" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 48 L 87 57 L 78 66" fill="none" stroke="#2ea043" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Node -->
    <circle cx="65" cy="57" r="4" fill="#2f81f7" />
  </g>

  <!-- TYPOGRAPHY -->
  <text x="142" y="74" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="42" fill="#e6edf3" letter-spacing="-0.5">Patch</text>
  
  <text x="260" y="74" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="42" fill="#2ea043" letter-spacing="0.2">Forge</text>
</svg>